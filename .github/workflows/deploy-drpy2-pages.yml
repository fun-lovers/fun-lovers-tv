name: Deploy drpy2 and unified TVBox assets to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag containing unified-tvbox-bundle.zip (blank = latest release)"
        required: false
        type: string
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'drpy2/**'
      - 'scripts/validate_unified_bundle.py'
      - 'scripts/unpack_unified_bundle.py'
      - '.github/workflows/deploy-drpy2-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned drpy2 runtime
        env:
          DRPY2_RUNTIME_URL: ${{ vars.DRPY2_RUNTIME_URL }}
          DRPY2_RUNTIME_SHA256: ${{ vars.DRPY2_RUNTIME_SHA256 }}
        run: |
          set -euo pipefail
          PINNED_COMMIT="ca23ffdbf5e429c5893ac60158668fc5af7af192"
          DEFAULT_URL="https://raw.githubusercontent.com/hjdhnx/dr_py/${PINNED_COMMIT}/libs/drpy2.min.js"
          URL="${DRPY2_RUNTIME_URL:-$DEFAULT_URL}"
          if [ -n "${DRPY2_RUNTIME_URL}" ] && [ -z "${DRPY2_RUNTIME_SHA256}" ]; then
            echo "DRPY2_RUNTIME_SHA256 is required when overriding DRPY2_RUNTIME_URL." >&2
            exit 1
          fi
          mkdir -p drpy2/public/libs
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" -o drpy2/public/libs/drpy2.min.js
          test "$(wc -c < drpy2/public/libs/drpy2.min.js)" -gt 1000
          ACTUAL_SHA256="$(sha256sum drpy2/public/libs/drpy2.min.js | awk '{print $1}')"
          if [ -n "${DRPY2_RUNTIME_SHA256}" ] && [ "$ACTUAL_SHA256" != "$DRPY2_RUNTIME_SHA256" ]; then
            echo "drpy2 runtime SHA-256 mismatch: expected $DRPY2_RUNTIME_SHA256, got $ACTUAL_SHA256" >&2
            exit 1
          fi
          printf '%s  %s\n' "$ACTUAL_SHA256" "drpy2.min.js" | tee drpy2/runtime-sha256.txt
          SOURCE_COMMIT="$PINNED_COMMIT"
          if [ -n "${DRPY2_RUNTIME_URL}" ]; then SOURCE_COMMIT="custom-url"; fi
          printf 'source_url=%s\nsource_commit=%s\n' "$URL" "$SOURCE_COMMIT" > drpy2/runtime-source.txt
      - name: Build static drpy2 Pages site
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/drpy2
        run: python drpy2/scripts/build_static.py --base-url "$PAGES_BASE_URL" --output dist/drpy2
      - name: Include runtime provenance
        run: |
          cp drpy2/runtime-sha256.txt dist/drpy2/
          cp drpy2/runtime-source.txt dist/drpy2/
      - name: Download unified bundle from GitHub Release when available
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          REQUIRED="false"
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG_EVENT"
            REQUIRED="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RELEASE_TAG_INPUT" ]; then
            TAG="$RELEASE_TAG_INPUT"
            REQUIRED="true"
          else
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' | head -n 1 || true)"
          fi
          if [ -z "$TAG" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "A release tag is required but was not resolved." >&2
              exit 1
            fi
            echo "No published release found; deploying drpy2 only."
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'unified-tvbox-bundle.zip'; then
            if [ "$REQUIRED" = "true" ]; then
              echo "Release $TAG does not contain unified-tvbox-bundle.zip." >&2
              exit 1
            fi
            echo "Latest release has no unified bundle; deploying drpy2 only."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "unified-tvbox-bundle.zip" --dir .
          test -s unified-tvbox-bundle.zip
          echo "Downloaded bundle from release $TAG"
      - name: Include and validate unified crawler bundle
        run: |
          set -euo pipefail
          if [ -f unified-tvbox-bundle.zip ]; then
            python scripts/unpack_unified_bundle.py unified-tvbox-bundle.zip dist/unified
            python scripts/validate_unified_bundle.py dist/unified
          else
            echo "Unified crawler bundle not attached to a published release; existing drpy2 Pages deployment continues."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
