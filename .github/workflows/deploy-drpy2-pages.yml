name: Deploy drpy2 and unified TVBox assets to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'drpy2/**'
      - 'unified-tvbox-bundle.zip'
      - 'scripts/validate_unified_bundle.py'
      - 'scripts/unpack_unified_bundle.py'
      - '.github/workflows/deploy-drpy2-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download drpy2 runtime
        env:
          DRPY2_RUNTIME_URL: ${{ vars.DRPY2_RUNTIME_URL }}
        run: |
          set -euo pipefail
          URL="${DRPY2_RUNTIME_URL:-https://raw.githubusercontent.com/hjdhnx/dr_py/main/libs/drpy2.min.js}"
          mkdir -p drpy2/public/libs
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" -o drpy2/public/libs/drpy2.min.js
          test "$(wc -c < drpy2/public/libs/drpy2.min.js)" -gt 1000
          sha256sum drpy2/public/libs/drpy2.min.js | tee drpy2/runtime-sha256.txt
      - name: Build static drpy2 Pages site
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/drpy2
        run: python drpy2/scripts/build_static.py --base-url "$PAGES_BASE_URL" --output dist/drpy2
      - name: Include runtime checksum
        run: cp drpy2/runtime-sha256.txt dist/drpy2/
      - name: Include unified crawler bundle when uploaded
        run: |
          set -euo pipefail
          if [ -f unified-tvbox-bundle.zip ]; then
            python scripts/unpack_unified_bundle.py unified-tvbox-bundle.zip dist/unified
            python scripts/validate_unified_bundle.py dist/unified
          else
            echo "Unified crawler bundle not uploaded; existing drpy2 Pages deployment continues."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
