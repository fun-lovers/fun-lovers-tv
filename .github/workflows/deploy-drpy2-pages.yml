name: Deploy drpy2 and unified TVBox assets to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag containing unified-tvbox-bundle.zip (blank = latest release)"
        required: false
        type: string
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "drpy2/**"
      - "netdisk/**"
      - "scripts/validate_unified_bundle.py"
      - "scripts/unpack_unified_bundle.py"
      - "scripts/audit_netdisk_bundle.py"
      - "scripts/build_netdisk_catalog.py"
      - ".github/workflows/deploy-drpy2-pages.yml"
      - ".github/workflows/audit-netdisk-assets.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight Python tools and regression tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/unpack_unified_bundle.py \
            scripts/validate_unified_bundle.py \
            scripts/audit_netdisk_bundle.py \
            scripts/build_netdisk_catalog.py
          python scripts/validate_unified_bundle.py --self-test
          python scripts/audit_netdisk_bundle.py --self-test

      - name: Download drpy2 runtime
        env:
          DRPY2_RUNTIME_URL: ${{ vars.DRPY2_RUNTIME_URL }}
        run: |
          set -euo pipefail
          URL="${DRPY2_RUNTIME_URL:-https://raw.githubusercontent.com/hjdhnx/dr_py/main/libs/drpy2.min.js}"
          mkdir -p drpy2/public/libs
          curl --fail --location --retry 3 --connect-timeout 20 "$URL" -o drpy2/public/libs/drpy2.min.js
          test "$(wc -c < drpy2/public/libs/drpy2.min.js)" -gt 1000
          sha256sum drpy2/public/libs/drpy2.min.js | tee drpy2/runtime-sha256.txt

      - name: Build static drpy2 Pages site
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/drpy2
        run: python drpy2/scripts/build_static.py --base-url "$PAGES_BASE_URL" --output dist/drpy2

      - name: Include runtime checksum
        run: cp drpy2/runtime-sha256.txt dist/drpy2/

      - name: Download unified bundle from GitHub Release when available
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          REQUIRED="false"
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG_EVENT"
            REQUIRED="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$RELEASE_TAG_INPUT" ]; then
            TAG="$RELEASE_TAG_INPUT"
            REQUIRED="true"
          else
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // empty')"
          fi

          if [ -z "$TAG" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "A release tag is required but was not resolved." >&2
              exit 1
            fi
            echo "No published release found; deploying drpy2 only."
            exit 0
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "unified-tvbox-bundle.zip"; then
            if [ "$REQUIRED" = "true" ]; then
              echo "Release $TAG does not contain unified-tvbox-bundle.zip." >&2
              exit 1
            fi
            echo "Latest release has no unified bundle; deploying drpy2 only."
            exit 0
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "unified-tvbox-bundle.zip" --dir .
          test -s unified-tvbox-bundle.zip
          echo "Downloaded bundle from Release $TAG."

      - name: Include and validate unified crawler bundle
        run: |
          set -euo pipefail
          if [ -f unified-tvbox-bundle.zip ]; then
            python scripts/unpack_unified_bundle.py unified-tvbox-bundle.zip dist/unified
            python scripts/validate_unified_bundle.py dist/unified
          else
            echo "No unified bundle attached to a published Release; continuing with the drpy2 site only."
          fi

      - name: Build TVBox netdisk source catalog from unified config
        run: |
          set -euo pipefail
          if [ -f dist/unified/tvbox-unified.json ]; then
            python scripts/build_netdisk_catalog.py dist/unified/tvbox-unified.json netdisk/tvbox-sites.json
            python - <<'PY'
            import json
            from pathlib import Path
            data = json.loads(Path("netdisk/tvbox-sites.json").read_text(encoding="utf-8"))
            if data["total"] < 1:
                raise SystemExit("No TVBox netdisk sites found")
            if any("ext" in site for site in data["sites"]):
                raise SystemExit("Catalog must not contain ext credential payloads")
            print("TVBox netdisk catalog validated:", data["total"], "entries")
            PY
          else
            echo "Unified config unavailable; omit dynamic TVBox netdisk catalog."
          fi

      - name: Validate netdisk portal and credential export mappings
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("netdisk/index.html").read_text(encoding="utf-8")
          required = [
              'id="exportEnv"', 'id="exportJar"',
              'quark_cookie', 'baidu_cookie', 'uc_cookie', 'uc_token',
              'quarkCookie', 'ucCookie', 'id="mergeFile"', 'id="mergeDownload"', 'id="jarToken"',
              'site_urls', 'threadinfo', 'quark_cookie', 'uc_token',
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("Missing portal features or verified field mappings: " + ", ".join(missing))
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.S)
          if not scripts:
              raise SystemExit("No inline portal script found")
          Path("/tmp/netdisk-portal.js").write_text("\\n".join(scripts), encoding="utf-8")
          print("Portal feature and credential mapping checks passed.")
          PY
          node --check /tmp/netdisk-portal.js

      - name: Publish netdisk search and account center
        run: |
          set -euo pipefail
          test -s netdisk/index.html
          mkdir -p dist/netdisk
          cp netdisk/index.html dist/netdisk/index.html
          if [ -s netdisk/tvbox-sites.json ]; then cp netdisk/tvbox-sites.json dist/netdisk/tvbox-sites.json; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
