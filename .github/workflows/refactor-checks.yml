name: Runtime and dependency contract checks

on:
  push:
    branches: [main, 'refactor/**']
    paths:
      - 'single-tvbox/**'
      - 'drpy2/**'
      - 'addons/**'
      - 'ysc-doc*.json'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'refactor/**'
  pull_request:
    branches: [main]
    paths:
      - 'single-tvbox/py/**'
      - 'drpy2/config/**'
      - 'drpy2/public/js/**'
      - 'scripts/check_runtime_contracts.py'
      - 'refactor/**'
      - '.github/workflows/refactor-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check workflow YAML syntax
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-drpy2-pages.yml'); YAML.load_file('.github/workflows/refactor-checks.yml')"
      - name: Check Python runtime contracts
        run: python scripts/check_runtime_contracts.py
      - name: Validate all JSON configurations
        run: python scripts/check_json_configs.py
      - name: Validate single-tvbox package
        run: python single-tvbox/scripts/validate.py
      - name: Compile Python sources
        run: python -m compileall -q single-tvbox/py scripts drpy2/scripts
      - name: Smoke-test static drpy2 build with pinned upstream runtime
        run: |
          set -euo pipefail
          PINNED_COMMIT="ca23ffdbf5e429c5893ac60158668fc5af7af192"
          EXPECTED_SHA256="fa829edf7d7e8e2453151322948940b85d9c9258144cbdd7430722e887e95a5d"
          mkdir -p drpy2/public/libs
          curl --fail --location --retry 3 --connect-timeout 20 "https://raw.githubusercontent.com/hjdhnx/dr_py/${PINNED_COMMIT}/libs/drpy2.min.js" -o drpy2/public/libs/drpy2.min.js
          test "$(wc -c < drpy2/public/libs/drpy2.min.js)" -gt 1000
          ACTUAL_SHA256="$(sha256sum drpy2/public/libs/drpy2.min.js | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "$ACTUAL_SHA256  drpy2.min.js"
          python drpy2/scripts/build_static.py --base-url https://example.github.io/fun-lovers-tv/drpy2 --output /tmp/tvbox-drpy2-build
          python -c "import json; from pathlib import Path; p=Path('/tmp/tvbox-drpy2-build/tvbox.json'); d=json.loads(p.read_text()); assert d['sites'] and all(s['type']==3 for s in d['sites']); assert (Path('/tmp/tvbox-drpy2-build/libs/drpy2.min.js')).is_file()"
      - name: Smoke-test unified bundle extraction and validation
        run: |
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('/tmp/sample-unified.zip', 'w') as z:
              z.writestr('sample/tvbox-unified.json', json.dumps({'sites': [{'key': 'sample', 'api': 'https://example.invalid/api'}]}))
              z.writestr('sample/jar-configs/sample.json', '{}')
          PY
          python scripts/unpack_unified_bundle.py /tmp/sample-unified.zip /tmp/sample-unified
          python scripts/validate_unified_bundle.py /tmp/sample-unified
      - name: Audit released unified bundle and JAR runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download tvbox-bundle-v1 --repo "$GITHUB_REPOSITORY" --pattern "unified-tvbox-bundle.zip" --dir /tmp
          python scripts/unpack_unified_bundle.py /tmp/unified-tvbox-bundle.zip /tmp/unified-release
          python scripts/validate_unified_bundle.py /tmp/unified-release
          python scripts/audit_unified_bundle.py /tmp/unified-release --output /tmp/jar-runtime-audit.json
      - name: Upload JAR runtime audit
        uses: actions/upload-artifact@v4
        with:
          name: jar-runtime-audit
          path: /tmp/jar-runtime-audit.json
          if-no-files-found: error
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in drpy2/public/js/*.js; do
            node --check "$file"
          done
